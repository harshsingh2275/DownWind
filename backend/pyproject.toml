[project]
name = "downwind-backend"
version = "0.1.0"
description = "DownWind backend services and algorithms"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# boto3 is only present in the Lambda runtime, not in the local dev env.
# boto3-stubs are not a project dependency (D-002: stdlib only for new deps).
# Suppress the import-not-found error for boto3 in mypy.
[[tool.mypy.overrides]]
module = "boto3"
ignore_missing_imports = true
